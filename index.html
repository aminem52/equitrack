        const { useState, useEffect, useMemo, useRef } = React;

        // Custom Component to securely render original Lucide icons without crashing
        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const spanRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name] && spanRef.current) {
                    spanRef.current.innerHTML = '';
                    const iconNode = window.lucide.icons[name];
                    const svg = window.lucide.createElement(iconNode);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    
                    if (className) {
                        className.split(' ').forEach(c => {
                            if (c.trim()) svg.classList.add(c.trim());
                        });
                    }
                    spanRef.current.appendChild(svg);
                }
            }, [name, size, className]);

            return <span ref={spanRef} className={`inline-flex items-center justify-center`} />;
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center">
                                <LucideIcon name="AlertCircle" size={48} className="text-red-500 mb-4 mx-auto" />
                                <h1 className="text-xl font-bold mb-2">App Component Error</h1>
                                <p className="text-sm text-gray-500 mb-4">Please screenshot this and show it to your developer.</p>
                                <pre className="bg-gray-100 p-4 rounded-xl text-xs overflow-auto text-red-600 text-left whitespace-pre-wrap">
                                    {this.state.error?.toString()}
                                </pre>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }
        
        const INITIAL_INVESTORS = [
            { id: 1, name: 'Alex Johnson', balance: 0, share: 25, avatar: 'https://placehold.co/100x100/10B981/ffffff?text=AJ' },
            { id: 2, name: 'Sarah Williams', balance: 0, share: 25, avatar: 'https://placehold.co/100x100/3B82F6/ffffff?text=SW' },
            { id: 3, name: 'Michael Chen', balance: 0, share: 25, avatar: 'https://placehold.co/100x100/F59E0B/ffffff?text=MC' },
            { id: 4, name: 'Emma Davis', balance: 0, share: 25, avatar: 'https://placehold.co/100x100/8B5CF6/ffffff?text=ED' },
        ];

        const INITIAL_TRANSACTIONS = [
            { id: 't1', date: new Date().toISOString(), type: 'system_income', amount: 0, description: 'Project Setup Complete', investorId: null }
        ];

        function Dashboard() {
            const [view, setView] = useState('admin');
            const [activeInvestorId, setActiveInvestorId] = useState(1);
            const [investors, setInvestors] = useState(INITIAL_INVESTORS);
            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
            
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            const [newInvestorName, setNewInvestorName] = useState('');
            const [newInvestorShare, setNewInvestorShare] = useState('');
            const [editingInvestor, setEditingInvestor] = useState(null);
            
            const [adminAction, setAdminAction] = useState('charge'); 
            const [amount, setAmount] = useState('');
            const [selectedInvestor, setSelectedInvestor] = useState(1);
            const [description, setDescription] = useState('');
            const [customDate, setCustomDate] = useState('');
            const [notification, setNotification] = useState(null);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            useEffect(() => {
                if (!window.firebaseAPI) return;
                const { db, doc, onSnapshot, setDoc } = window.firebaseAPI;
                const docRef = doc(db, 'equitrack', 'main_app_state');
                
                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.investors) setInvestors(data.investors);
                        if (data.transactions) setTransactions(data.transactions);
                    } else {
                        setDoc(docRef, { investors: INITIAL_INVESTORS, transactions: INITIAL_TRANSACTIONS })
                            .catch(err => console.error("Initialization error:", err));
                    }
                }, (err) => {
                    console.error("Database Read Error:", err);
                });
                
                return () => unsubscribe();
            }, []);

            const syncToFirebase = async (newInvestors, newTransactions) => {
                setInvestors(newInvestors);
                setTransactions(newTransactions);
                
                if (!window.firebaseAPI) {
                    showNotification("Firebase is not connected!", "error");
                    return;
                }
                
                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    const docRef = doc(db, 'equitrack', 'main_app_state');
                    // Saving to cloud directly without Auth check
                    await setDoc(docRef, { investors: newInvestors, transactions: newTransactions });
                } catch (err) {
                    showNotification("Failed to save to cloud!", "error");
                }
            };

            const totalCompanyBalance = useMemo(() => investors.reduce((sum, inv) => sum + inv.balance, 0), [investors]);
            const totalIncomeGenerated = useMemo(() => transactions.filter(t => t.type === 'company_income').reduce((sum, t) => sum + t.amount, 0), [transactions]);

            const handleTransaction = (e) => {
                e.preventDefault();
                if (!amount || isNaN(amount) || Number(amount) <= 0) {
                    showNotification('Please enter a valid amount', 'error');
                    return;
                }

                const numAmount = Number(amount);
                let txDate = customDate ? new Date(customDate) : new Date();

                const newTx = {
                    id: Date.now().toString(),
                    date: txDate.toISOString(),
                    amount: numAmount,
                    description: description || getDefaultDescription(adminAction, numAmount),
                };

                let updatedInvestors = [...investors];
                try {
                    switch (adminAction) {
                        case 'charge':
                            newTx.type = 'daily_charge';
                            newTx.investorId = null;
                            updatedInvestors = updatedInvestors.map(inv => ({ ...inv, balance: inv.balance - numAmount }));
                            break;
                        case 'pay':
                            newTx.type = 'investor_payment';
                            newTx.investorId = Number(selectedInvestor);
                            updatedInvestors = updatedInvestors.map(inv => inv.id === Number(selectedInvestor) ? { ...inv, balance: inv.balance + numAmount } : inv);
                            break;
                        case 'income':
                            newTx.type = 'company_income';
                            newTx.investorId = null;
                            updatedInvestors = updatedInvestors.map(inv => ({ ...inv, balance: inv.balance + (numAmount * (Number(inv.share) || 0) / 100) }));
                            break;
                        case 'withdraw':
                            newTx.type = 'investor_withdrawal';
                            newTx.investorId = Number(selectedInvestor);
                            updatedInvestors = updatedInvestors.map(inv => inv.id === Number(selectedInvestor) ? { ...inv, balance: inv.balance - numAmount } : inv);
                            break;
                        default: return;
                    }

                    const updatedTransactions = [newTx, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
                    syncToFirebase(updatedInvestors, updatedTransactions);
                    
                    setAmount(''); setDescription(''); setCustomDate('');
                    showNotification(`Transaction saved successfully!`);
                } catch (error) {
                    showNotification(error.message, 'error');
                }
            };

            const getDefaultDescription = (action, amt) => {
                switch (action) {
                    case 'charge': return `Daily requirement charge of $${amt}`;
                    case 'pay': return `Payment received`;
                    case 'income': return `Company income distribution`;
                    case 'withdraw': return `Funds withdrawal`;
                    default: return 'Transaction';
                }
            };

            const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
            const formatDate = (isoString) => new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(isoString));

            const handleClearData = () => {
                const resetInvestors = investors.map(inv => ({ ...inv, balance: 0 }));
                syncToFirebase(resetInvestors, INITIAL_TRANSACTIONS);
                setShowClearConfirm(false);
                showNotification('All data has been cleared permanently.');
            };

            const handleDeleteTransaction = (txId) => {
                const tx = transactions.find(t => t.id === txId);
                if (!tx) return;

                let updatedInvestors = [...investors];
                if (tx.type === 'daily_charge') {
                    updatedInvestors = updatedInvestors.map(inv => ({ ...inv, balance: inv.balance + tx.amount }));
                } else if (tx.type === 'investor_payment') {
                    updatedInvestors = updatedInvestors.map(inv => inv.id === tx.investorId ? { ...inv, balance: inv.balance - tx.amount } : inv);
                } else if (tx.type === 'company_income') {
                    updatedInvestors = updatedInvestors.map(inv => ({...inv, balance: inv.balance - (tx.amount * (Number(inv.share) || 0) / 100)}));
                } else if (tx.type === 'investor_withdrawal') {
                    updatedInvestors = updatedInvestors.map(inv => inv.id === tx.investorId ? { ...inv, balance: inv.balance + tx.amount } : inv);
                }

                const newTransactions = transactions.filter(t => t.id !== txId);
                syncToFirebase(updatedInvestors, newTransactions);
                showNotification('Action undone successfully.');
            };

            const renderHeader = () => (
                <header className="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">

                                    </select>

                                <button

                                >
                                    <LucideIcon name="Trash2" size={16} /> Reset Data
                                </button>
                            </div>
                        </div>
                        <div className="p-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                                {investors.map(inv => (
                                    <div key={inv.id} className="border border-gray-200 rounded-lg p-4 relative bg-white hover:border-blue-300 transition-colors shadow-sm">
                                        {editingInvestor === inv.id ? (
                                            <div className="space-y-3">
                                                <input type="text" defaultValue={inv.name} id={`edit-name-${inv.id}`} className="w-full text-sm border border-gray-300 rounded p-1.5" placeholder="Name"/>
                                                <div className="flex items-center gap-2">
                                                    <input type="number" defaultValue={inv.share} id={`edit-share-${inv.id}`} className="w-full text-sm border border-gray-300 rounded p-1.5" placeholder="Share %"/>

                                                </div>
                                                <div className="flex gap-2 pt-2">
                                                    <button onClick={() => {
                                                        const newName = document.getElementById(`edit-name-${inv.id}`).value;
                                                        const newShare = document.getElementById(`edit-share-${inv.id}`).value;
                                                        const updated = investors.map(i => i.id === inv.id ? {...i, name: newName, share: Number(newShare)} : i);
                                                        syncToFirebase(updated, transactions);

                                <div className="flex flex-col sm:flex-row items-start sm:items-end gap-4">

                                </div>
                                <div className="p-6">
                                    <form onSubmit={handleTransaction} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Action Type</label>
                                            <select value={adminAction} onChange={(e) => setAdminAction(e.target.value)} className="w-full border-gray-300 border rounded-lg p-2 sm:text-sm bg-white">
                                                <option value="charge">Require Daily Payment (All)</option>
                                                <option value="pay">Record Investor Payment</option>
                                                <option value="income">Add Company Income (Split)</option>
                                                <option value="withdraw">Record Investor Withdrawal</option>
                                            </select>
                                        </div>
                                        {(adminAction === 'pay' || adminAction === 'withdraw') && (
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Select Investor</label>
                                                <select value={selectedInvestor} onChange={(e) => setSelectedInvestor(e.target.value)} className="w-full border-gray-300 border rounded-lg p-2 sm:text-sm bg-white">
                                                    {investors.map(inv => <option key={inv.id} value={inv.id}>{inv.name}</option>)}
                                                </select>
                                            </div>
                                        )}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Amount ($)</label>
                                            <input type="number" min="0.01" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} className="block w-full sm:text-sm border border-gray-300 rounded-lg py-2 px-3" placeholder="0.00"/>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Description</label>
                                            <input type="text" value={description} onChange={(e) => setDescription(e.target.value)} className="block w-full sm:text-sm border border-gray-300 rounded-lg py-2 px-3" placeholder="e.g. Server costs"/>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Transaction Date (Optional)</label>
                                            <input type="datetime-local" value={customDate} onChange={(e) => setCustomDate(e.target.value)} className="block w-full sm:text-sm border border-gray-300 rounded-lg py-2 px-3 bg-white"/>
                                            <p className="mt-1 text-xs text-gray-500">Leave blank for current time.</p>
                                        </div>
                                        <button type="submit" className="w-full flex justify-center py-2.5 px-4 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 mt-2">Submit</button>
                                    </form>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <div className="px-6 py-4 border-b border-gray-100 bg-gray-50/50"><h2 className="font-semibold text-gray-900">Current Balances</h2></div>
                                <ul className="divide-y divide-gray-100">
                                    {investors.map(inv => (
                                        <li key={inv.id} className="p-4 flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <img src={inv.avatar} alt={inv.name} className="h-10 w-10 rounded-full border border-gray-200" />
                                                <div><p className="text-sm font-medium text-gray-900">{inv.name}</p></div>
                                            </div>
                                            <div className={`text-sm font-bold px-3 py-1 rounded-full ${inv.balance > 0 ? 'bg-emerald-100 text-emerald-700' : inv.balance < 0 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'}`}>
                                                {inv.balance > 0 ? '+' : ''}{formatCurrency(inv.balance)}
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <div className="px-6 py-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                                    <h2 className="font-semibold text-gray-900 flex items-center gap-2"><LucideIcon name="History" size={20} className="text-gray-500" /> Ledger History</h2>
                                </div>
                                <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                                    <table className="min-w-full divide-y divide-gray-200">
                                        <thead className="bg-white sticky top-0 z-0">
                                            <tr>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                                                <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y divide-gray-200">
                                            {transactions.map((tx) => (
                                                <tr key={tx.id} className="hover:bg-gray-50">
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{formatDate(tx.date)}</td>
                                                    <td className="px-6 py-4 text-sm text-gray-900">
                                                        {tx.description}
                                                        {tx.investorId && <span className="ml-2 text-xs text-gray-500 block sm:inline">({investors.find(i => i.id === tx.investorId)?.name})</span>}
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm">
                                                        <span className="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full border bg-gray-50 text-gray-700">{tx.type.replace('_', ' ').toUpperCase()}</span>
                                                    </td>
                                                    <td className={`px-6 py-4 whitespace-nowrap text-sm font-medium ${(tx.type === 'daily_charge' || tx.type === 'investor_withdrawal') ? 'text-red-600' : 'text-emerald-600'}`}>
                                                        {(tx.type === 'daily_charge' || tx.type === 'investor_withdrawal') ? '-' : '+'}{formatCurrency(tx.amount)}
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                        {tx.type !== 'system_income' && (
                                                            <button onClick={() => handleDeleteTransaction(tx.id)} className="text-red-500 hover:text-red-700 p-1 bg-red-50 hover:bg-red-100 rounded transition-colors" title="Undo">
                                                                <LucideIcon name="Trash2" size={16} />
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderInvestorView = () => {
                const myData = investors.find(i => i.id === activeInvestorId);
                if (!myData) return null;
                const isPositive = myData.balance > 0;
                const isNegative = myData.balance < 0;
                const myTransactions = transactions.filter(t => t.investorId === myData.id || t.investorId === null);

                return (
                    <div className="max-w-4xl mx-auto px-4 py-10 space-y-8">
                        <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="bg-gradient-to-r from-gray-900 to-gray-800 p-6 sm:p-8 text-white flex flex-col md:flex-row items-center justify-between gap-6">
                                <div className="flex items-center gap-5 text-center sm:text-left">
                                    <img src={myData.avatar} alt={myData.name} className="h-16 w-16 sm:h-20 sm:w-20 rounded-full border-4 border-gray-700 bg-gray-800" />
                                    <div><h1 className="text-2xl sm:text-3xl font-bold">{myData.name}</h1><p className="text-gray-400 mt-1 text-sm sm:text-base">Dashboard ({myData.share}%)</p></div>
                                </div>
                                <div className="bg-gray-800/50 p-6 rounded-2xl border border-gray-700/50 text-center w-full md:w-auto min-w-[200px]">
                                    <p className="text-gray-400 text-sm font-medium mb-1">Current Balance</p>
                                    <h2 className={`text-4xl font-bold ${isPositive ? 'text-emerald-400' : isNegative ? 'text-red-400' : 'text-white'}`}>
                                        {isPositive ? '+' : ''}{formatCurrency(myData.balance)}
                                    </h2>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="px-6 py-5 border-b border-gray-100 bg-gray-50/50"><h2 className="font-semibold text-gray-900 text-lg">Your Activity</h2></div>
                            <div className="divide-y divide-gray-100">
                                {myTransactions.map((tx) => {
                                    let displayAmount = tx.amount;
                                    let isCredit = (tx.type === 'company_income' || tx.type === 'investor_payment');
                                    let IconName = "Clock";
                                    let iconColor = "text-gray-500";

                                    if (tx.type === 'company_income') {
                                        displayAmount = (tx.amount * (Number(myData.share) || 0)) / 100;
                                        IconName = "TrendingUp"; iconColor = "text-emerald-500";
                                    } else if (tx.type === 'investor_payment') {
                                        IconName = "ArrowUpRight"; iconColor = "text-blue-500";
                                    } else if (tx.type === 'daily_charge') {
                                        IconName = "ArrowDownRight"; iconColor = "text-red-500";
                                    } else if (tx.type === 'investor_withdrawal') {
                                        IconName = "LogOut"; iconColor = "text-orange-500";
                                    }

                                    return (
                                        <div key={tx.id} className="p-4 sm:p-5 flex flex-row items-center justify-between hover:bg-gray-50 transition-colors">
                                            <div className="flex items-center gap-3 sm:gap-4">
                                                <div className={`p-2 rounded-full ${isCredit ? 'bg-emerald-50' : 'bg-red-50'} hidden sm:block`}>
                                                    <LucideIcon name={IconName} size={20} className={iconColor} />
                                                </div>
                                                <div>
                                                    <p className="font-medium text-gray-900 text-sm sm:text-base">{tx.description}</p>
                                                    <p className="text-xs text-gray-500 mt-0.5">{formatDate(tx.date)}</p>
                                                </div>
                                            </div>
                                            <div className={`font-bold text-sm sm:text-base ${isCredit ? 'text-emerald-600' : 'text-red-600'}`}>
                                                {isCredit ? '+' : '-'}{formatCurrency(displayAmount)}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 text-gray-900 pb-12">
                    {renderHeader()}
                    <main>{view === 'admin' ? renderAdminView() : renderInvestorView()}</main>
                    
                    {notification && (
                        <div className={`fixed bottom-4 right-4 flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-white font-medium transition-all z-50 ${notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                            <LucideIcon name={notification.type === 'error' ? 'AlertCircle' : 'CheckCircle'} size={20} />
                            {notification.message}
                        </div>
                    )}
                    
                    {showClearConfirm && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden p-6 text-center border border-red-100">
                                <LucideIcon name="AlertTriangle" size={48} className="text-red-500 mb-2 mx-auto" />
                                <h2 className="text-xl font-bold text-gray-900 mb-2">Clear All Data?</h2>
                                <p className="text-gray-500 text-sm mb-6">Are you sure? This will delete all history and set all balances to zero. This cannot be undone.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowClearConfirm(false)} className="flex-1 py-2 px-4 border border-gray-300 rounded-xl font-medium">Cancel</button>
                                    <button onClick={handleClearData} className="flex-1 py-2 px-4 bg-red-600 rounded-xl text-white font-medium">Yes, Clear All</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [ready, setReady] = useState(window.firebaseReady);
            const [error, setError] = useState(window.firebaseError);
            
            useEffect(() => {
                const handleReady = () => setReady(true);
                window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            if (error) {
                 return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-4">
                        <LucideIcon name="AlertCircle" size={48} className="text-red-500 mb-4 mx-auto" />
                        <h2 className="text-xl font-bold">Database Connection Failed</h2>
                        <p className="text-gray-500 mt-2 text-center text-sm">{error}</p>
                    </div>
                );
            }

            if (!ready) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="flex flex-col items-center gap-4">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
                            <p className="text-gray-500 font-medium text-sm">Connecting to Database...</p>
                        </div>
                    </div>
                );
            }

            return (
                <ErrorBoundary>
                    <Dashboard />
                </ErrorBoundary>
            );
        }

        const domContainer = document.getElementById('root');
        const root = ReactDOM.createRoot(domContainer);
        root.render(<App />);
    </script>
</body>
</html>
